
name: Robinhood Connection Test

on:
  push:
    branches:
      - robinhood-connection-test
    paths:
      - ".github/workflows/robinhood-test.yml"
      - "robinhood_test.py"

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Get test code
        uses: actions/checkout@v4

      - name: Run connection test
        run: python robinhood_test.py
